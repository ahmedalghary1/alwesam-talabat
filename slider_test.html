<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            direction: rtl;
        }

        .slider-container {
            width: 100vw;
            height: 70vh;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .slider-slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: zoomInOnly 3s ease-out forwards;
        }

        @keyframes zoomInOnly {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.15);
            }
        }

        .slider-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: #FFC400;
            transform: scale(1.3);
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 20;
        }
    </style>
</head>

<body>
    <div class="info">
        <h3>اختبار السلايدر - 3 صور</h3>
        <p>الصورة الحالية: <span id="current">1</span> / <span id="total">3</span></p>
        <p>عدد النقاط: <span id="dotcount">0</span></p>
    </div>

    <div class="slider-container">
        <div class="slider-slides">
            <div class="slide">
                <img src="file:///c:/Users/ELWSAM H/Desktop/project/alwesam-talabat1/static/images/link3.jpg"
                    alt="Slide 1">
            </div>
            <div class="slide">
                <img src="file:///c:/Users/ELWSAM H/Desktop/project/alwesam-talabat1/static/images/hero_slide_2.jpg"
                    alt="Slide 2">
            </div>
            <div class="slide">
                <img src="file:///c:/Users/ELWSAM H/Desktop/project/alwesam-talabat1/static/images/hero_slide_3.jpg"
                    alt="Slide 3">
            </div>
        </div>

        <div class="slider-dots"></div>
    </div>

    <script>
        let currentSlideIndex = 0;
        let autoSlideInterval;

        function createDots() {
            const dotsContainer = document.querySelector('.slider-dots');
            const slides = document.querySelectorAll('.slide');

            dotsContainer.innerHTML = '';
            slides.forEach((_, index) => {
                const dot = document.createElement('span');
                dot.className = index === 0 ? 'dot active' : 'dot';
                dot.onclick = () => showSlide(index);
                dotsContainer.appendChild(dot);
            });

            document.getElementById('dotcount').textContent = slides.length;
            document.getElementById('total').textContent = slides.length;
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.slide');
            const totalSlides = slides.length;

            if (index >= totalSlides) currentSlideIndex = 0;
            else if (index < 0) currentSlideIndex = totalSlides - 1;
            else currentSlideIndex = index;

            const slidesContainer = document.querySelector('.slider-slides');
            slidesContainer.style.transform = `translateX(-${currentSlideIndex * 100}%)`;

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlideIndex);
            });

            document.getElementById('current').textContent = currentSlideIndex + 1;

            // Restart animation
            const currentImg = slides[currentSlideIndex].querySelector('img');
            if (currentImg) {
                currentImg.style.animation = 'none';
                void currentImg.offsetWidth;
                currentImg.style.animation = 'zoomInOnly 3s ease-out forwards';
            }
        }

        function autoSlide() {
            showSlide(currentSlideIndex + 1);
        }

        function init() {
            createDots();
            showSlide(0);
            autoSlideInterval = setInterval(autoSlide, 3000);
        }

        init();
    </script>
</body>

</html>
