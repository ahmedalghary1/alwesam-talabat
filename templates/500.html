{% extends 'base.html' %}
{% load static %}

{% block title %}500 - خطأ في الخادم{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="error-icon mb-3">
        <i class="fas fa-server" style="font-size: 6rem; color: #ef4444;"></i>
    </div>

    <h1 class="text-4xl font-black mb-2">500</h1>
    <h2 class="text-2xl font-bold mb-2">خطأ في الخادم</h2>
    <p class="text-secondary mb-4">عذراً، حدث خطأ غير متوقع. نعمل على حل المشكلة</p>

    <div class="flex gap-2 justify-center">
        <a href="{% url 'home:home' %}" class="btn-primary">
            <i class="fas fa-home ml-2"></i>
            العودة للرئيسية
        </a>
        <button onclick="location.reload()" class="btn-secondary">
            <i class="fas fa-redo ml-2"></i>
            إعادة المحاولة
        </button>
    </div>
</div>
{% endblock %}
