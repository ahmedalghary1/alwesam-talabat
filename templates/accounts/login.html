{% extends 'base.html' %}
{% load static %}

{% block title %}تسجيل الدخول - الوسام{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }

    .auth-card {
        background: var(--card-bg);
        border: 2px solid var(--border-color);
        border-radius: 20px;
        padding: 2.5rem;
        max-width: 450px;
        width: 100%;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #FFC400;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        color: #1a1a1a;
        font-size: 2rem;
        box-shadow: 0 10px 30px rgba(255, 196, 0, 0.3);
    }

    .auth-title {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
    }

    .auth-subtitle {
        color: var(--text-secondary);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
    }

    .form-input {
        width: 100%;
        padding: 0.875rem 1rem;
        font-size: 1rem;
        border-radius: 10px;
        border: 2px solid var(--border-color);
        background: var(--bg-primary);
        color: var(--text-primary);
        transition: all 0.3s ease;
    }

    .form-input:focus {
        outline: none;
        border-color: #FFC400;
        box-shadow: 0 0 0 3px rgba(255, 196, 0, 0.1);
    }

    .btn-submit {
        width: 100%;
        padding: 1rem;
        background: #FFC400;
        color: #1a1a1a;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.3s ease;
    }

    .btn-submit:hover {
        background: #e6b000;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255, 196, 0, 0.3);
    }

    .auth-footer {
        text-align: center;
        padding-top: 1.5rem;
        margin-top: 1.5rem;
        border-top: 1px solid var(--border-color);
    }

    .text-accent {
        color: #FFC400;
        font-weight: 600;
        text-decoration: none;
    }

    .text-accent:hover {
        text-decoration: underline;
    }

    /* Password Toggle */
    .password-wrapper {
        position: relative;
    }

    .password-toggle {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 0.5rem;
        font-size: 1.1rem;
        transition: color 0.3s ease;
        z-index: 1;
    }

    .password-toggle:hover {
        color: #FFC400;
    }

    .password-wrapper .form-input {
        padding-left: 3rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fas fa-sign-in-alt"></i>
            </div>
            <h1 class="auth-title">تسجيل الدخول</h1>
            <p class="auth-subtitle">مرحباً بعودتك إلى الوسام</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-envelope" style="color: #FFC400;"></i>
                    البريد الإلكتروني أو رقم الهاتف
                </label>
                <input type="text" name="email" class="form-input" placeholder="example@email.com أو +20123456789"
                    required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-lock" style="color: #FFC400;"></i>
                    كلمة المرور
                </label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="password" class="form-input" placeholder="••••••••"
                        required>
                    <button type="button" class="password-toggle" onclick="togglePassword('password')">
                        <i class="fas fa-eye" id="password-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i>
                تسجيل الدخول
            </button>
        </form>

        <div class="auth-footer">
            <p>ليس لديك حساب؟
                <a href="{% url 'accounts:signup' %}" class="text-accent">سجل الآن</a>
            </p>
        </div>
    </div>
</div>

<script>
    function togglePassword(fieldId) {
        const passwordField = document.getElementById(fieldId);
        const icon = document.getElementById(fieldId + '-icon');

        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordField.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
