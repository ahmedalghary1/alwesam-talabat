{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - الوسام</title>
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
    <link href="{% static 'css/layout.css' %}" rel="stylesheet">
    <link href="{% static 'css/components.css' %}" rel="stylesheet">
    <link href="{% static 'css/pages.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="theme-light">
    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="nav-left">
                <a href="{% url 'home' %}" class="logo">
                    <div class="logo-icon"><img src="{% static 'images/ELWSAM.png' %}" alt="" width="110%" height="110%"></div>
                    <span>الوسام</span>
                </a>
            </div>

            <ul class="nav-menu" id="nav-menu">
                <li><a href="{% url 'home' %}" class="nav-link">الرئيسية</a></li>
                <li><a href="alwesam_category.html" class="nav-link">المنتجات</a></li>
                <li><a href="alwesam_cart.html" class="nav-link">الطلبات</a></li>
                <li><a href="alwesam_admin.html" class="nav-link">لوحة التحكم</a></li>
            </ul>

            <div class="nav-actions">
                <button class="action-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
                <div class="lang-selector">
                    <button class="lang-btn" title="تبديل اللغة">
                        <i class="fas fa-globe"></i>
                    </button>
                    <!-- Standard Dropdown -->
                    <div class="lang-dropdown">
                        <button class="lang-option active" disabled>
                            <i class="fas fa-check-circle"></i> العربية
                        </button>
                        <button class="lang-option" disabled>
                            <i class="fas fa-circle"></i> English
                        </button>
                    </div>
                </div>
                <div class="mobile-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
                <a href="alwesam_login.html" class="btn-primary btn-login">
                    <i class="fas fa-sign-in-alt ml-2"></i> <span>تسجيل الدخول</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- SIGNUP CARD -->
    <div class="login-container">
        <div class="glass-card login-card animate-scale-in">
            <div class="text-center mb-2">
                <div class="logo justify-center mb-1">
                    <div class="logo-icon icon-lg"><i class="fas fa-bolt"></i></div>
                </div>
                <h2 class="text-2xl font-black mb-05">إنشاء حساب جديد</h2>
                <p class="text-secondary">انضم إلينا في عالم الوسام</p>
            </div>

            <form action="alwesam_home.html" class="login-form">
                <div class="form-group">
                    <label class="form-label">الاسم الكامل</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="form-input" placeholder="مثال: أحمد محمد" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="form-input" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">تأكيد كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary w-full pulse-on-hover">
                    إنشاء حساب
                </button>

                <div class="text-center mt-1 text-sm">
                    لديك حساب بالفعل؟ <a href="alwesam_login.html" class="text-accent font-bold hover-underline">سجل
                        الدخول</a>
                </div>
            </form>
        </div>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
</body>

</html>
